name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore oldani.keystore -alias oldani \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=OldAni, OU=Dev, O=OldAni, L=Unknown, S=Unknown, C=CN"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (armeabi-v7a, minSdk 21)
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/OldAni-armeabi-v7a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OldAni-armeabi-v7a
          path: app/build/outputs/apk/release/OldAni-armeabi-v7a.apk